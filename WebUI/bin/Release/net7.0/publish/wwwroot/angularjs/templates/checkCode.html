<div ng-controller="masterController as vm" ng-init="vm.initializeController()">
    <div class="authincation"  style="margin-top:45px">
        <div class="container h-100">
            <div class="row justify-content-center h-100 align-items-center">
                <div class="col-xl-5 col-md-6">
                    <div class="mini-logo text-center my-4">
                        <a href="intro.html"><img src="images/logo.png" alt=""></a>
                        <h4 class="card-title mt-3">گالری تاج آبادی</h4>
                    </div>
                    <div class="auth-form card">
                        <div class="card-body">
                            <p class="text-center mb-3">کد ارسال شده به {{vm.item.PhoneNumber}} را وارد کنید</p>
                            <form ng-submit="vm.checkCode()" class="row g-3">
                                <div class="col-12">
                                    <div class="input-group">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text py-3">
                                                <i class="icofont-ui-touch-phone"></i>
                                            </span>
                                        </div>
                                        <input ng-model="vm.Code"
                                               type="text" class="form-control" placeholder="کد تائید">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="text-center">
                                        <button type="submit" class="btn btn-primary btn-block">ارسال</button>
                                    </div>
                                </div>
                            </form>
                            <!--<div class="new-account mt-3">
                                <p>کد ارسال نشد ؟ <a class="text-primary" href="otp-1.html">ارسال مجدد</a></p>
                            </div>-->
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
