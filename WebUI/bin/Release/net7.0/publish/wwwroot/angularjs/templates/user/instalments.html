<div ng-controller="instalmentController as vm" ng-init="vm.initializeController()">
    <div class="content-body">
        <div class="container">
            <div class="row">
                <div class="col-xxl-12">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">اقساط</h4>
                            <!--<button style="height: 40px; margin-right: 1000px;" type="button" class="btn btn-primary"
                                    ng-click="showFilter = !showFilter">
                                فیلتر
                            </button>-->
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table ng-table="vm.tableParams" show-filter="showFilter"
                                       class="table table-striped responsive-table">
                                    <tbody>
                                        <tr style="text-align:center"
                                            ng-repeat="row in $data track by row.Id">
                                            <td data-title="'ردیف'">
                                                <h6 class="table-responsive-title mb-0 fw-normal">
                                                    <a>{{$index + 1}}</a>
                                                </h6>
                                            </td>
                                            <td data-title="'شماره قرارداد'"
                                                filter="{TransactionFactorId: 'text'}" sortable="'TransactionFactorId'">
                                                <h6 class="table-responsive-title mb-0 fw-normal">
                                                    <a>{{row.TransactionFactorId}}</a>
                                                </h6>
                                            </td>
                                            <td data-title="'شماره فاکتور'"
                                                filter="{FactorId: 'text'}" sortable="'FactorId'">
                                                <h6 class="table-responsive-title mb-0 fw-normal">
                                                    <a>{{row.FactorId}}</a>
                                                </h6>
                                            </td>
                                            <td data-title="'مبلغ'"
                                                filter="{Amount: 'text'}" sortable="'Amount'">
                                                <h6 class="table-responsive-title mb-0 fw-normal">
                                                    <a>{{row.Amount | NumberToMoney}}</a>
                                                </h6>
                                            </td>
                                            <td data-title="'تاریخ سررسید'"
                                                filter="{ExpireDate: 'ng-table/filters/datePicker.html'}" sortable="'ExpireDate'">
                                                <h6 class="table-responsive-title mb-0 fw-normal">
                                                    <a>{{row.ExpireDate | persianDate:'dddd, jD jMMMM jYY HH:mm'}}</a>
                                                </h6>
                                            </td>
                                            <td data-title="'تاریخ پرداخت'"
                                                filter="{PayDate: 'ng-table/filters/datePicker.html'}" sortable="'PayDate'">
                                                <h6 class="table-responsive-title mb-0 fw-normal">
                                                    <a>{{row.PayDate | persianDate:'dddd, jD jMMMM jYY HH:mm'}}</a>
                                                </h6>
                                            </td>
                                            <td data-title="'وضعیت پرداخت'"
                                                sortable="'State'">
                                                <h6 class="table-responsive-title mb-0 fw-normal">
                                                    <a ng-class="{'text-success':row.State == 0, 'text-danger':row.State == 1}">
                                                        {{vm.paymentStates[row.State].title}}
                                                    </a>
                                                </h6>
                                            </td>
                                            <td data-title="'عملیات'">
                                                <span ng-if="row.State == 1" style="cursor:pointer;color:green;font-size:15px">
                                                    <i title="پرداخت" ng-click="vm.getInstalmentPayLink(row.Id)"
                                                       class="icofont-ui-v-card"></i>
                                                </span>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addBank" tabindex="-1">
        <div style="margin-top:150px" class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">افزودن حساب بانکی</h5>
                    <button type="button" class="btn-close" data-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="verify-step-6.html" class="identity-upload">
                        <div class="row g-3">
                            <div class="col-xl-12">
                                <label class="form-label">شماره کارت </label>
                                <input type="text" class="form-control" placeholder="">
                            </div>
                            <div class="col-xl-12">
                                <label class="form-label">شماره حساب </label>
                                <input type="text" class="form-control" placeholder="">
                            </div>
                            <div class="col-xl-12">
                                <label class="form-label">نام و نام خانوادگی </label>
                                <input type="text" class="form-control" placeholder="">
                            </div>

                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-dismiss="modal" data-toggle="modal" data-target="#successBankAccount">تائید</button>
                </div>
            </div>
        </div>
    </div>

    <script type="text/ng-template" id="ng-table/filters/datePicker.html">
        <adm-dtp options="{dtpType:'date',format: 'YYYY/MM/DD'}" ng-model="params.filter()[name]" style="direction:ltr"></adm-dtp>
    </script>

</div>
