<div ng-controller="educationController as vm" ng-init="vm.initializeController()">
    <div class="container">
        <div class="card" id="ai-queue" aria-labelledby="ai-queue-title">

            <div class="row" style="margin-bottom:40px">
                <div class="col-md-10">
                    <h1 style="margin-top:20px;text-align:left!important;margin-bottom:0!important">
                        <span style="font-size: 30px !important" class="sub-gradient">Educations</span>
                    </h1>
                </div>
                <div style="margin-top:25px" class="col-md-2">
                    <a ng-click="vm.resetItem()" data-dismiss="modal" data-bs-toggle="modal" data-bs-target="#addOrUpdateModal"
                       class="btn primary" style="float: right;" href="#!/login">Add</a>
                </div>
            </div>

            <div class="custom_table table-responsive">
                <table style="font-size: 15px !important; font-weight: 200 !important; font-family: myFirstFont!important"
                       ng-table="vm.tableParams" show-filter="showFilter"
                       class="table table-striped responsive-table">
                    <tbody>
                        <tr style="text-align:center"
                            ng-repeat="row in $data track by row.Id">
                            <td data-title="'#'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{$index + 1}}</a>
                                </h6>
                            </td>
                            <td data-title="'Academy'"
                                filter="{Academy: 'text'}" sortable="'Academy'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.Academy}}</a>
                                </h6>
                            </td>
                            <td data-title="'Degree'"
                                filter="{Degree: 'text'}" sortable="'Degree'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.Degree}}</a>
                                </h6>
                            </td>
                            <td data-title="'Score'"
                                filter="{Score: 'text'}" sortable="'Score'">
                                <h6 class="table-responsive-title mb-0 fw-normal">
                                    <a>{{row.Score}}</a>
                                </h6>
                            </td>
                            <td data-title="'Operation'">
                                <span style="cursor:pointer;color:red">
                                    <i title="Delete" ng-click="vm.getRow(row)"
                                       data-dismiss="modal" data-bs-toggle="modal" data-bs-target="#deleteModal"
                                       class="icofont-ui-delete"></i>
                                </span>
                                <span style="cursor:pointer;color:cornflowerblue">
                                    <i title="Edit" ng-click="vm.getRow(row)"
                                       data-dismiss="modal" data-bs-toggle="modal" data-bs-target="#addOrUpdateModal"
                                       class="icofont-pencil"></i>
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="modal fade" id="addOrUpdateModal" tabindex="-1" aria-labelledby="addOrUpdateModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content modal-lg ">

                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>

                <div class="modal-body text-center">
                    <div class="row">
                        <div class="field col-md-12">
                            <label style="float:left!important">Academy</label>
                            <input ng-model="vm.item.Academy" type="text">
                        </div>
                        <div class="field col-md-6">
                            <label style="float:left!important">Degree</label>
                            <input ng-model="vm.item.Degree" type="text">
                        </div>
                        <div class="field col-md-6">
                            <label style="float:left!important">Score</label>
                            <input ng-model="vm.item.Score" type="number">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn ghost" data-bs-dismiss="modal">Close</button>
                    <button ng-click="vm.addOrUpdate()" type="button" class="btn btn-danger" id="confirmDelete">Save</button>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
                </div>

                <div class="modal-body text-center">
                    Are you sure you want to delete this item?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn ghost" data-bs-dismiss="modal">Close</button>
                    <button ng-click="vm.delete()" type="button" class="btn btn-danger" id="confirmDelete">Yes</button>
                </div>

            </div>
        </div>
    </div>

</div>
