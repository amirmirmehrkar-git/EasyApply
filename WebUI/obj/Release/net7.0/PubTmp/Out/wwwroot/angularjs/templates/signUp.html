<div ng-controller="masterController as vm" ng-init="vm.initializeController()">
    <div class="authincation"  style="margin-top:45px">
        <div class="container h-100">
            <div class="row justify-content-center h-100 align-items-center">
                <div class="col-xl-5 col-md-6">
                    <div class="mini-logo text-center my-4">
                        <a href="intro.html"><img src="images/logo.png" alt=""></a>
                        <h4 class="card-title mt-3">گالری تاج آبادی</h4>
                    </div>
                    <div class="auth-form card">
                        <div class="card-body">
                            <form method="post" name="myform" class="signin_validate row g-3" 
                                  ng-submit="vm.signUp()">
                                <div class="col-5">
                                    <input ng-model="vm.item.FirstName" type="text" class="form-control"
                                           placeholder="نام" name="name">
                                </div>
                                <div class="col-7">
                                    <input ng-model="vm.item.LastName" type="text" class="form-control"
                                           placeholder="نام خانوادگی" name="name">
                                </div>
                                <div class="col-12">
                                    <input ng-model="vm.item.PhoneNumber" type="text" class="form-control"
                                           placeholder="شماره تماس" name="email">
                                </div>
                                <div class="col-12">
                                    <input ng-model="vm.item.Password" type="password" class="form-control"
                                           placeholder="رمز عبور" name="password">
                                </div>

                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary btn-block">ساخت حساب</button>
                                </div>
                            </form>
                            <div class="text-center">
                                <p class="mt-3 mb-0"> <a class="text-primary" href="#!/">ورود</a> به حساب کاربری</p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
